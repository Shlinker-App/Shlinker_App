name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'assets/badges/**'

  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'assets/badges/**'

  workflow_dispatch:

concurrency:
  group: ci-${{ forge.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: docker
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Set up JDK and Android SDK
        run: ci/setup-android.sh 2>&1 | tee -a ci.log
      - name: Run ktlint, Android lint, unit tests, and debug build
        run: ./gradlew --no-daemon ktlintCheck lintDebug lintDevsDebug testDebugUnitTest testDevsDebugUnitTest assembleDevsDebug 2>&1 | tee -a ci.log
      - name: Check for proprietary dependencies
        run: |
          ./gradlew --no-daemon :app:dependencies --configuration stableReleaseRuntimeClasspath -q > deps.txt 2>> ci.log
          if grep -iE 'com\.google\.(android\.gms|firebase)|com\.google\.android\.play|crashlytics|com\.android\.billingclient' deps.txt; then
            echo "::error::Proprietary dependency found; F-Droid check failed" | tee -a ci.log; exit 1
          fi
          echo "OK: no proprietary dependencies"
      - name: Record screenshots with Roborazzi
        run: ./gradlew --no-daemon recordRoborazziDebug 2>&1 | tee -a ci.log
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: shlinker-devs-debug-apk
          path: app/build/outputs/apk/devs/debug/*.apk
          retention-days: 7
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: screenshots
          path: '**/build/outputs/roborazzi/*.png'
          retention-days: 14
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
      - name: Post log tail to issue
        if: failure()
        env:
          TOKEN: ${{ forge.token }}
        run: ci/report-failure.sh ci.log
