name: Testbuild

# Erzeugt ein Pre-Release mit direkt herunterladbarer Debug-APK.
# Auslösen: Tag pushen, z. B. `git tag v0.1.0-debug.1 && git push origin v0.1.0-debug.1`
on:
  push:
    tags: ['v*-debug.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug
      - name: Pre-Release mit APK anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK="linkwerk-${TAG#v}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" --prerelease \
            --title "Linkwerk – Testbuild ${TAG#v}" \
            --notes "Debug-Testbuild (\`at.awit.linkwerk.debug\`, mit Debug-Schlüssel signiert). Installiert sich neben anderen Apps. Nicht für den produktiven Einsatz. Commit: ${GITHUB_SHA::7}"
