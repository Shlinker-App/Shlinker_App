name: Testbuild

# Erzeugt ein Pre-Release mit direkt herunterladbarer Debug-APK.
# Auslösen: Tag pushen, z. B. `git tag v0.1.0-debug.2 && git push origin v0.1.0-debug.2`
on:
  push:
    tags: ['v*-debug.*']

jobs:
  release:
    runs-on: docker
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: JDK und Android SDK einrichten
        run: ci/setup-android.sh 2>&1 | tee -a ci.log
      - run: ./gradlew --no-daemon assembleDebug 2>&1 | tee -a ci.log
      - name: Pre-Release mit APK anlegen
        env:
          TOKEN: ${{ forge.token }}
          API: ${{ forge.server_url }}/api/v1/repos/${{ forge.repository }}
          TAG: ${{ forge.ref_name }}
          SHA: ${{ forge.sha }}
        run: |
          APK="shlinker-${TAG#v}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          BODY=$(node -e 'console.log(JSON.stringify({
            tag_name: process.env.TAG,
            name: "Shlinker – Testbuild " + process.env.TAG.slice(1),
            body: "Debug-Testbuild (`at.awit.shlinker.debug`, mit Debug-Schlüssel signiert). Installiert sich neben anderen Apps. Nicht für den produktiven Einsatz. Commit: " + process.env.SHA.slice(0, 7),
            prerelease: true,
          }))')
          ID=$(curl -fsS -X POST "$API/releases" -H "Authorization: token $TOKEN" \
                 -H 'Content-Type: application/json' -d "$BODY" \
               | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id))')
          curl -fsS -X POST "$API/releases/$ID/assets?name=$APK" -H "Authorization: token $TOKEN" \
               -F "attachment=@$APK" > /dev/null
          echo "Release $TAG angelegt (ID $ID)"
      - name: Log-Ende in Issue #1 posten
        if: failure()
        env:
          TOKEN: ${{ forge.token }}
        run: ci/report-failure.sh ci.log
