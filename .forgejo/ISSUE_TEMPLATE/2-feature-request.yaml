name: Feature request
about: Suggest an idea or an improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea. Issues are public and are copied between Forgejo and GitHub. Never post API keys, passwords, tokens or confidential server URLs. Redact addresses where needed.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or the workflow you are trying to improve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you considered or work around today?
    validations:
      required: false
  - type: checkboxes
    id: secrets
    attributes:
      label: Before you submit
      options:
        - label: I did not include API keys, passwords, tokens or confidential server URLs.
          required: true
