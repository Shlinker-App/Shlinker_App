name: Test Fehlerbericht
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: docker
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - run: echo "Testlauf für den Fehlerbericht – bitte ignorieren" | tee ci.log; false
      - if: failure()
        env:
          TOKEN: ${{ forge.token }}
        run: ci/report-failure.sh ci.log
