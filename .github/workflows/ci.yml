name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: ktlint, Lint, Unit-Tests, Debug-Build
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: linkwerk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  instrumented:
    name: Gerätetests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 36
            target: aosp_atd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentierte Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: instrumented-reports-api${{ matrix.api }}
          path: '**/build/reports/androidTests/'
          retention-days: 7
