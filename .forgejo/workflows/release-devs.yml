name: Release DEVS

# A vX.Y.Z tag builds the signed dev APK, publishes it to the Forgejo package registry
# (generic/shlinker-devs/X.Y.Z) and creates a pre-release with the matching CHANGELOG.md section.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: docker
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Set up JDK and Android SDK
        run: ci/setup-android.sh
      - name: Verify tag matches versionName
        run: |
          VERSION="${FORGEJO_REF_NAME#v}"
          APP_VERSION=$(sed -nE 's/^\s*versionName = "(.*)"/\1/p' app/build.gradle.kts)
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $FORGEJO_REF_NAME does not match versionName $APP_VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$FORGEJO_ENV"
      - name: Read release notes from CHANGELOG.md
        run: |
          NOTES="${RUNNER_TEMP:-/tmp}/release-notes.md"
          awk -v heading="## $VERSION " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$NOTES"
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          echo "NOTES=$NOTES" >> "$FORGEJO_ENV"
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHLINKER_DEVS_KEYSTORE_B64 }}
        run: |
          KEYSTORE="${RUNNER_TEMP:-/tmp}/shlinker-devs.jks"
          base64 -d <<< "$KEYSTORE_B64" > "$KEYSTORE"
          echo "SHLINKER_DEVS_STORE_FILE=$KEYSTORE" >> "$FORGEJO_ENV"
      - name: Build dev APK
        env:
          SHLINKER_DEVS_STORE_PASSWORD: ${{ secrets.SHLINKER_DEVS_STORE_PASSWORD }}
          SHLINKER_DEVS_KEY_ALIAS: ${{ secrets.SHLINKER_DEVS_KEY_ALIAS }}
          SHLINKER_DEVS_KEY_PASSWORD: ${{ secrets.SHLINKER_DEVS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDevsRelease
      - name: Verify APK signature
        env:
          # SHA-256 fingerprint of the dev signing certificate (see README).
          EXPECTED_CERT: 453bb552a5c6ed1e3724e41a900f90c291f852db66acea5b616bd14b26f3b999
        run: |
          APK=$(ls app/build/outputs/apk/devs/release/*.apk)
          CERTS=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS" | grep -E 'certificate (DN|SHA-256 digest):'
          ACTUAL=$(echo "$CERTS" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' | sort -u)
          if [ "$ACTUAL" != "$EXPECTED_CERT" ]; then
            echo "::error::APK is not signed with the dev key (found: ${ACTUAL:-no signature})"; exit 1
          fi
          sha256sum "$APK" | awk -v f="$(basename "$APK")" '{print $1"  "f}' > "$APK.sha256"
          cat "$APK.sha256"
          echo "APK=$APK" >> "$FORGEJO_ENV"
      - name: Upload to package registry
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          BASE="$FORGEJO_SERVER_URL/api/packages/$FORGEJO_REPOSITORY_OWNER/generic/shlinker-devs/$VERSION"
          PAGE="$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY_OWNER/-/packages/generic/shlinker-devs/$VERSION"
          # Keep published versions unchanged: rerunning the build can produce a different APK.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: token $TOKEN" \
            "$BASE/$(basename "$APK")")
          if [ "$STATUS" = "200" ]; then
            echo "::warning::Version $VERSION is already published; skipping upload: $PAGE"
            exit 0
          fi
          for f in "$APK" "$APK.sha256"; do
            curl --fail-with-body -sS -H "Authorization: token $TOKEN" \
              --upload-file "$f" "$BASE/$(basename "$f")"
          done
          echo "Uploaded: $PAGE"
      - name: Create pre-release with changelog
        env:
          TOKEN: ${{ forge.token }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          REPO="${FORGEJO_REPOSITORY:-$GITHUB_REPOSITORY}"
          API="$FORGEJO_SERVER_URL/api/v1/repos/$REPO"
          TAG="$FORGEJO_REF_NAME"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
          if [ "$STATUS" = "200" ]; then
            echo "::warning::Release $TAG already exists; skipping"
            exit 0
          fi
          BASE="$FORGEJO_SERVER_URL/api/packages/$FORGEJO_REPOSITORY_OWNER/generic/shlinker-devs/$VERSION"
          PAGE="$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY_OWNER/-/packages/generic/shlinker-devs/$VERSION"
          NAME=$(basename "$APK")
          DIR="${RUNNER_TEMP:-/tmp}/release-assets"
          mkdir -p "$DIR"
          # Attach the files exactly as published, even if this run rebuilt a different APK.
          for f in "$NAME" "$NAME.sha256"; do
            curl --fail-with-body -sS -H "Authorization: token $PACKAGES_TOKEN" -o "$DIR/$f" "$BASE/$f"
          done
          {
            cat "$NOTES"
            printf '\n---\n\nPackage: %s\n\nSHA-256: `%s`\n' "$PAGE" "$(cut -d' ' -f1 "$DIR/$NAME.sha256")"
          } > "$DIR/body.md"
          BODY=$(TAG="$TAG" VERSION="$VERSION" BODY_FILE="$DIR/body.md" node -e '
            const fs = require("fs");
            console.log(JSON.stringify({
              tag_name: process.env.TAG,
              name: "Shlinker DEVS " + process.env.VERSION,
              body: fs.readFileSync(process.env.BODY_FILE, "utf8"),
              draft: false,
              prerelease: true,
            }));
          ')
          ID=$(curl --fail-with-body -sS -X POST -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' -d "$BODY" "$API/releases" \
            | node -e 'let s = ""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).id))')
          for f in "$NAME" "$NAME.sha256"; do
            curl --fail-with-body -sS -H "Authorization: token $TOKEN" \
              -F "attachment=@$DIR/$f" "$API/releases/$ID/assets?name=$f" > /dev/null
          done
          echo "Pre-release: $FORGEJO_SERVER_URL/$REPO/releases/tag/$TAG"
      - name: Remove signing key
        if: always()
        run: rm -f "${RUNNER_TEMP:-/tmp}/shlinker-devs.jks"
